# ┌─────────────────────────────────────────────────────────────────┐
# │  Deskly v1 – VULNERABLE (intentional, for security lab only)    │
# │                                                                 │
# │  3-tier layout:                                                 │
# │   frontend  →  nginx:80  (reverse proxy)                        │
# │   backend   →  flask:5000                                       │
# │   db        →  db_data volume  (SQLite file)                    │
# └─────────────────────────────────────────────────────────────────┘

services:

  # ── BACKEND ──────────────────────────────────────────────────── #
  backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: deskly_backend
    restart: unless-stopped
    environment:
      # Path inside container where the SQLite volume is mounted
      DATABASE: /app/data/deskly_v1.db
      # [VULN #4B] weak secret — kept intentionally for lab
      SECRET_KEY: "deskly-dev-secret"
      # [VULN #5] debug mode on — keeps stack traces visible
      FLASK_DEBUG: "1"
    volumes:
      # db tier: SQLite file lives on a named volume, separate from
      # the container image → data survives container restarts
      - db_data:/app/data
    expose:
      - "5000"
    networks:
      - deskly_net
    healthcheck:
      test: ["CMD", "python", "-c",
             "import urllib.request; urllib.request.urlopen('http://localhost:5000/')"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ── FRONTEND (reverse proxy) ──────────────────────────────────── #
  frontend:
    image: nginx:1.25-alpine
    container_name: deskly_frontend
    restart: unless-stopped
    ports:
      - "80:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      backend:
        condition: service_healthy
    networks:
      - deskly_net

# ── VOLUMES ──────────────────────────────────────────────────────── #
volumes:
  db_data:
    name: deskly_db_data
    # This named volume IS the "db tier": isolated, persisted,
    # mountable independently for DB inspection or backup.

# ── NETWORKS ─────────────────────────────────────────────────────── #
networks:
  deskly_net:
    name: deskly_network
    driver: bridge
