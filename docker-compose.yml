# ┌─────────────────────────────────────────────────────────────────┐
# │  Deskly v2 – SECURE                                            │
# │                                                                 │
# │  3-tier layout:                                                 │
# │   frontend  →  nginx:80  (reverse proxy)                        │
# │   backend   →  flask:5000                                       │
# │   db        →  db_data volume  (SQLite file)                    │
# └─────────────────────────────────────────────────────────────────┘

services:

  # ── BACKEND ──────────────────────────────────────────────────── #
  backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: deskly_backend
    restart: unless-stopped
    environment:
      DATABASE: /app/data/deskly_v2.db
      SECRET_KEY: "v2-s3cur3-r4nd0m-k3y-ch4ng3-1n-pr0d"
      FLASK_DEBUG: "0"
    volumes:
      - db_data:/app/data
    expose:
      - "5000"
    ports:
      - "5001:5000"
    networks:
      - deskly_net
    healthcheck:
      test: ["CMD", "python", "-c",
             "import urllib.request; urllib.request.urlopen('http://localhost:5000/')"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ── FRONTEND (reverse proxy) ──────────────────────────────────── #
  frontend:
    image: nginx:1.25-alpine
    container_name: deskly_frontend
    restart: unless-stopped
    ports:
      - "80:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      backend:
        condition: service_healthy
    networks:
      - deskly_net

# ── VOLUMES ──────────────────────────────────────────────────────── #
volumes:
  db_data:
    name: deskly_db_data

# ── NETWORKS ─────────────────────────────────────────────────────── #
networks:
  deskly_net:
    name: deskly_network
    driver: bridge
