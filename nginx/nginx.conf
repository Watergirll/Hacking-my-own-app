upstream flask_backend {
    server backend:5000;
}

server {
    listen 80;
    server_name _;

    # Increase buffer for large responses (useful during PoC demos)
    proxy_buffer_size          16k;
    proxy_buffers              4 32k;
    proxy_busy_buffers_size    64k;

    # Pass all requests to Flask backend
    location / {
        proxy_pass         http://flask_backend;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;

        # Allow cookies to pass through correctly
        proxy_cookie_path  / /;
    }

    # Health-check endpoint (useful for Docker healthcheck)
    location /healthz {
        access_log off;
        return 200 "ok\n";
        add_header Content-Type text/plain;
    }

    # Nginx error pages — does NOT expose internal stack traces
    error_page 502 503 504 /50x.html;
    location = /50x.html {
        root /usr/share/nginx/html;
    }
}
