{% extends "base.html" %}
{% block title %}403 Forbidden{% endblock %}
{% block content %}
<div class="text-center py-5">
  <i class="bi bi-shield-x text-danger" style="font-size:4rem"></i>
  <h2 class="mt-3">403 — Access Denied</h2>
  <p class="text-muted">You don't have permission to access this resource.</p>
  <a href="{{ url_for('main.dashboard') }}" class="btn btn-outline-secondary mt-2">
    <i class="bi bi-arrow-left me-1"></i>Back to dashboard
  </a>
</div>
{% endblock %}
