<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Register — Deskly</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" />
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet" />
  <style>
    body {
      background: #0f172a;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .card { border: none; border-radius: 1rem; }
    .brand-icon { font-size: 2.5rem; color: #6366f1; }
    .role-card {
      cursor: pointer;
      border: 2px solid #dee2e6;
      border-radius: .5rem;
      transition: border-color .15s, background .15s;
      padding: .75rem 1rem;
    }
    .role-card:hover { border-color: #6366f1; background: #f0f0ff; }
    input[type="radio"]:checked + .role-card {
      border-color: #6366f1;
      background: #ededfd;
    }
  </style>
</head>
<body>
  <div style="width:100%;max-width:460px;padding:1rem">

    <div class="text-center mb-4">
      <i class="bi bi-shield-check brand-icon"></i>
      <h3 class="text-white mt-2 mb-0 fw-bold">Deskly</h3>
      <p class="text-secondary small">Create your account</p>
    </div>

    <div class="card shadow-lg p-4">
      <h5 class="mb-4 fw-semibold">New account</h5>

      {% with messages = get_flashed_messages(with_categories=true) %}
        {% if messages %}
          {% for category, message in messages %}
            <div class="alert alert-{{ category }} py-2 small">{{ message }}</div>
          {% endfor %}
        {% endif %}
      {% endwith %}

      <form method="POST">
        <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
        <div class="mb-3">
          <label class="form-label small fw-semibold" for="email">Email address</label>
          <div class="input-group">
            <span class="input-group-text"><i class="bi bi-envelope"></i></span>
            <input
              type="email" id="email" name="email"
              class="form-control" placeholder="you@company.io"
              required autofocus
            />
          </div>
        </div>

        <div class="mb-4">
          <label class="form-label small fw-semibold" for="password">Password</label>
          <div class="input-group">
            <span class="input-group-text"><i class="bi bi-lock"></i></span>
            <input
              type="password" id="password" name="password"
              class="form-control" placeholder="••••••••"
              required
            />
          </div>
        </div>

        <div class="mb-4">
          <label class="form-label small fw-semibold d-block">Role</label>
          <div class="d-flex gap-3">
            <label class="flex-fill">
              <input type="radio" name="role" value="ANALYST" class="d-none" checked />
              <div class="role-card">
                <div class="fw-semibold"><i class="bi bi-person me-1 text-primary"></i>Analyst</div>
                <div class="text-muted small">Manages own tickets</div>
              </div>
            </label>
            <label class="flex-fill">
              <input type="radio" name="role" value="MANAGER" class="d-none" />
              <div class="role-card">
                <div class="fw-semibold"><i class="bi bi-person-gear me-1 text-warning"></i>Manager</div>
                <div class="text-muted small">Full access + audit log</div>
              </div>
            </label>
          </div>
        </div>

        <button type="submit" class="btn w-100" style="background:#6366f1;color:#fff">
          <i class="bi bi-person-plus me-1"></i>Create account
        </button>
      </form>

      <p class="text-center text-muted small mt-3 mb-0">
        Already have an account?
        <a href="{{ url_for('auth.login') }}">Login</a>
      </p>
    </div>

  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script>
    // Visual highlight for role radio selection
    document.querySelectorAll('input[name="role"]').forEach(radio => {
      radio.addEventListener('change', () => {
        document.querySelectorAll('.role-card').forEach(c => {
          c.style.borderColor = '';
          c.style.background = '';
        });
        if (radio.checked) {
          radio.nextElementSibling.style.borderColor = '#6366f1';
          radio.nextElementSibling.style.background  = '#ededfd';
        }
      });
    });
  </script>
</body>
</html>
