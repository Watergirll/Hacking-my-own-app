<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Login — Deskly</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" />
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet" />
  <style>
    body {
      background: #0f172a;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .card { border: none; border-radius: 1rem; }
    .brand-icon { font-size: 2.5rem; color: #6366f1; }
  </style>
</head>
<body>
  <div style="width:100%;max-width:420px;padding:1rem">

    <div class="text-center mb-4">
      <i class="bi bi-shield-check brand-icon"></i>
      <h3 class="text-white mt-2 mb-0 fw-bold">Deskly</h3>
      <p class="text-secondary small">Incident Management Platform</p>
    </div>

    <div class="card shadow-lg p-4">
      <h5 class="mb-4 fw-semibold">Sign in to your account</h5>

      {% with messages = get_flashed_messages(with_categories=true) %}
        {% if messages %}
          {% for category, message in messages %}
            <div class="alert alert-{{ category }} py-2 small">{{ message }}</div>
          {% endfor %}
        {% endif %}
      {% endwith %}

      <form method="POST">
        <div class="mb-3">
          <label class="form-label small fw-semibold" for="email">Email address</label>
          <div class="input-group">
            <span class="input-group-text"><i class="bi bi-envelope"></i></span>
            <input
              type="email" id="email" name="email"
              class="form-control" placeholder="analyst@deskly.io"
              required autofocus
            />
          </div>
        </div>

        <div class="mb-4">
          <label class="form-label small fw-semibold" for="password">Password</label>
          <div class="input-group">
            <span class="input-group-text"><i class="bi bi-lock"></i></span>
            <input
              type="password" id="password" name="password"
              class="form-control" placeholder="••••••••"
              required
            />
          </div>
        </div>

        <button type="submit" class="btn w-100" style="background:#6366f1;color:#fff">
          <i class="bi bi-box-arrow-in-right me-1"></i>Login
        </button>
      </form>

      <p class="text-center text-muted small mt-3 mb-0">
        Don't have an account?
        <a href="{{ url_for('auth.register') }}">Register</a>
      </p>
    </div>

  </div>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
