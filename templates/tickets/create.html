{% extends "base.html" %}
{% block title %}New Ticket{% endblock %}

{% block content %}
<div class="mb-4">
  <a href="{{ url_for('tickets.list_tickets') }}" class="text-muted text-decoration-none small">
    <i class="bi bi-arrow-left me-1"></i>Back to tickets
  </a>
  <h4 class="fw-bold mt-1 mb-0">New Ticket</h4>
</div>

<div class="card border-0 shadow-sm" style="max-width:680px">
  <div class="card-body p-4">
    <form method="POST">
      <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
      <div class="mb-3">
        <label class="form-label fw-semibold small" for="title">Title <span class="text-danger">*</span></label>
        <input type="text" id="title" name="title" class="form-control"
               placeholder="Brief description of the incident" maxlength="200" required />
      </div>

      <div class="mb-3">
        <label class="form-label fw-semibold small" for="description">
          Description <span class="text-danger">*</span>
        </label>
        <textarea id="description" name="description" class="form-control" rows="5"
                  placeholder="Detailed description..." required></textarea>
      </div>

      <div class="row g-3 mb-3">
        <div class="col-sm-6">
          <label class="form-label fw-semibold small" for="severity">Severity</label>
          <select id="severity" name="severity" class="form-select">
            {% for s in severities %}
              <option value="{{ s }}">{{ s }}</option>
            {% endfor %}
          </select>
        </div>
        <div class="col-sm-6">
          <label class="form-label fw-semibold small" for="tags">Tags</label>
          <input type="text" id="tags" name="tags" class="form-control"
                 placeholder="network, patching, phishing (comma separated)" />
          <div class="form-text">Separate multiple tags with commas.</div>
        </div>
      </div>

      <div class="d-flex gap-2">
        <button type="submit" class="btn" style="background:#6366f1;color:#fff">
          <i class="bi bi-plus-circle me-1"></i>Create Ticket
        </button>
        <a href="{{ url_for('tickets.list_tickets') }}" class="btn btn-outline-secondary">Cancel</a>
      </div>
    </form>
  </div>
</div>
{% endblock %}
